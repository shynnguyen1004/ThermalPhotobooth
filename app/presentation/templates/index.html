<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ org_name }} Photobooth</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/img/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="brand-header">
      <img
        class="brand-header__logo"
        src="/static/img/uts/lockup-full.png"
        alt="UTS and Ho Chi Minh City University of Technology"
      />
    </header>

    <div class="sysbar" aria-label="System status">
      <div class="sysbar__inner">
        <div class="sysbar__items">
          <div class="sys-item" data-key="camera">
            <span class="sys-dot is-warn" id="dotCamera"></span>
            <span class="sys-label">Camera:</span>
            <span class="sys-value is-warn" id="valCamera">waiting</span>
          </div>
          <div class="sys-item" data-key="webcam">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-ok" id="dotWebcam"></span>
            <span class="sys-label">Webcam:</span>
            <span class="sys-value" id="valWebcam">—</span>
          </div>
          <div class="sys-item" data-key="printer">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-ok" id="dotPrinter"></span>
            <span class="sys-label">Printer:</span>
            <span class="sys-value" id="valPrinter">—</span>
          </div>
          <div class="sys-item" data-key="cloud">
            <span class="sys-sep">·</span>
            <span class="sys-dot {% if cloudinary_enabled %}is-ok{% else %}is-warn{% endif %}" id="dotCloud"></span>
            <span class="sys-label">Cloudinary:</span>
            <span class="sys-value" id="valCloud">{% if cloudinary_enabled %}OK{% else %}not configured{% endif %}</span>
          </div>
          <div class="sys-item" data-key="last">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-muted" id="dotLast"></span>
            <span class="sys-label">Last:</span>
            <span class="sys-value" id="valLast">—</span>
          </div>
        </div>
        <div class="sysbar__pulse" title="System">
          <span class="sys-label">SYS</span>
          <span class="pulse-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>
      </div>
    </div>

    <main class="stage">
      <section class="viewport" id="viewport" aria-label="Live camera feed">
        <video
          id="liveVideo"
          class="viewport__video"
          playsinline
          muted
          autoplay
          hidden
        ></video>

        <div class="viewport__idle" id="viewportIdle">
          <div class="viewport__focus">
            <img class="viewport__cam-icon" src="/static/img/icons/icon-camera-placeholder.svg" alt="" width="80" height="80" />
            <img class="viewport__bracket" src="/static/img/icons/icon-focus-bracket.svg" alt="" width="72" height="72" />
          </div>
          <p class="viewport__title">LIVE CAMERA FEED</p>
          <p class="viewport__subtitle" id="viewportSubtitle">Preview is off — tap to enable when needed</p>
          <button type="button" class="enable-cam" id="btnEnableCam">
            Enable Webcam Preview
          </button>
        </div>

        <div class="live-badge" id="liveBadge">
          <span class="live-badge__dot"></span>
          <span id="liveBadgeText">OFF</span>
        </div>
        <button type="button" class="preview-toggle" id="btnPreviewToggle" aria-pressed="false" title="Toggle live webcam">
          Preview <span id="previewToggleState">OFF</span>
        </button>
        <div class="res-badge" id="resBadge">—</div>

        <fieldset class="style-chip" aria-label="Print dither style">
          <legend>Print style</legend>
          <label class="style-chip__opt">
            <input type="radio" name="ditherStyle" value="floyd" checked />
            <span>Floyd</span>
          </label>
          <label class="style-chip__opt">
            <input type="radio" name="ditherStyle" value="comic" />
            <span>Comic-dot</span>
          </label>
        </fieldset>
      </section>

      <aside class="result-drawer" id="resultDrawer" hidden aria-label="Capture result">
        <div class="result-drawer__head">
          <h2>Result</h2>
          <button type="button" class="result-drawer__close" id="btnCloseResult" aria-label="Close">×</button>
        </div>
        <p id="resultMsg" class="result-drawer__msg"></p>
        <img id="photoPreview" class="result-drawer__photo" alt="Captured photo" />
        <div class="result-drawer__thumbs" id="frameGrid"></div>
        <figure class="result-drawer__print">
          <figcaption>Print layout</figcaption>
          <img id="printPreview" alt="Thermal print layout" />
        </figure>
      </aside>

      <div class="actions" role="group" aria-label="Capture and print">
        <button id="btnCamera" class="btn btn--primary" type="button" disabled>
          <img src="/static/img/icons/icon-camera.svg" alt="" width="22" height="22" />
          <span class="btn__text">
            <span class="btn__label">Camera</span>
          </span>
        </button>

        <button id="btnWebcam" class="btn btn--primary btn--solid" type="button" disabled>
          <img src="/static/img/icons/icon-webcam.svg" alt="" width="22" height="22" />
          <span class="btn__text">
            <span class="btn__label">Webcam</span>
          </span>
        </button>

        <div class="reprint-group">
          <label class="copies-chip" for="reprintCopies">
            <span>Copies</span>
            <input
              id="reprintCopies"
              type="number"
              min="1"
              max="20"
              value="1"
              inputmode="numeric"
              aria-label="Reprint copies"
            />
          </label>
          <button id="btnReprint" class="btn btn--outline" type="button" disabled>
            <img src="/static/img/icons/icon-reprint.svg" alt="" width="20" height="20" />
            <span class="btn__text">
              <span class="btn__label">Reprint</span>
              <span class="btn__hint" id="hintReprint">Reprint</span>
            </span>
          </button>
        </div>
      </div>

      <div id="statusBar" class="toast" role="status" aria-live="polite" hidden></div>
    </main>
  </div>

  <script>
    window.BOOTH_CONFIG = {
      burstCount: {{ burst_count }},
      burstIntervalSec: {{ burst_interval_sec }},
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
