<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your photo — {{ org_name }}</title>
  <link rel="icon" href="/static/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="guest">
  <main class="guest-card">
    <img class="guest-lockup" src="/static/img/uts/lockup-full.png" alt="UTS and HCMUT" />
    <span class="event-pill">Photobooth</span>
    <h1>Your photo</h1>
    <p class="muted">ID: {{ photo_id }}</p>

    <section class="guest-section">
      <h2 class="guest-section__title">Color photo</h2>
      <img class="guest-photo" src="{{ photo_url }}" alt="Color photobooth photo" />
      <a class="cta cta--compact" href="{{ photo_url }}" download="uts-{{ photo_id }}.jpg">Download color photo</a>
    </section>

    {% if layout_url %}
    <section class="guest-section">
      <h2 class="guest-section__title">Print layout</h2>
      <img class="guest-layout" src="{{ layout_url }}" alt="Layout photobooth" />
      <a class="cta cta--compact cta--outline" href="{{ layout_url }}" download="uts-{{ photo_id }}-layout.png">Download print layout</a>
    </section>
    {% endif %}
  </main>
</body>
</html>
